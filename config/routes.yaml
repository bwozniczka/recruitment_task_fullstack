api_rates:
  path: /api/rates
  controller: App\Controller\ExchangeRateController::index
  methods: GET

api_rates_history:
  path: /api/rates/{code}/history
  controller: App\Controller\ExchangeRateController::getHistory
  methods: GET

setupcheck:
  path: /api/setup-check
  controller: App\Controller\DefaultController::setupCheck

index:
  path: /{wildcard}
  defaults: { _controller: App\Controller\DefaultController::index }
  requirements:
    wildcard: .*
  # controller: App\Controller\DefaultController::index
